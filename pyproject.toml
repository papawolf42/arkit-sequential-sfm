[project]
name = "capture-training-server"
version = "0.1.0"
description = "Bounded mobile capture ingestion and configured Gaussian training jobs"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<0.130", "uvicorn>=0.30,<1", "pillow>=11,<13", "plyfile>=1.1,<2", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
