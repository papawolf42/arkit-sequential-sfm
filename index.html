<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Capture jobs</title>
<style>body{font:16px system-ui;max-width:700px;margin:40px auto;padding:16px}input,button{padding:10px;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Capture jobs</h1><p>Upload images + transforms.json ZIP. No backend means blocked, not trained.</p>
<label>API token <input id="token" type="password" autocomplete="off"></label><br>
<input id="file" type="file" accept=".zip"><button id="upload">Upload</button><br>
<label>Job ID <input id="job"></label><button id="refresh">Refresh</button><button id="download">Download PLY</button>
<pre id="status" role="status"></pre><pre id="logs"></pre>
<script>
const el=id=>document.getElementById(id);
async function call(path, options={}) { const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+el('token').value,...options.headers}}); if(!r.ok)throw Error(await r.text());return r; }
async function refresh(){const id=encodeURIComponent(el('job').value);el('status').textContent=JSON.stringify(await (await call('/jobs/'+id)).json(),null,2);el('logs').textContent=(await (await call('/jobs/'+id+'/logs')).json()).log;}
function action(fn){return async()=>{try{await fn()}catch(e){el('status').textContent=e.message}}}
el('upload').onclick=action(async()=>{const file=el('file').files[0];if(!file)throw Error('Select a ZIP');const job=await (await call('/jobs',{method:'POST',headers:{'Content-Type':'application/zip'},body:file})).json();el('job').value=job.id;await refresh()});
el('refresh').onclick=action(refresh);
el('download').onclick=action(async()=>{const blob=await(await call('/jobs/'+encodeURIComponent(el('job').value)+'/artifact')).blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='splat.ply';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></html>
